name: 楽天放置アフィ自動化

on:
  schedule:
    # すべてUTC表記。日本時間(JST)はUTC+9。
    - cron: "0 0 1 * *"      # 毎月1日 09:00 JST -> ジャンル抽出
    - cron: "0 0 * * 1,4"    # 毎週月・木 09:00 JST -> 比較記事生成
    - cron: "30 0 * * 1,4"   # 毎週月・木 09:30 JST -> Pinterest投稿案生成
  workflow_dispatch:
    inputs:
      task:
        description: "手動実行するタスク"
        required: true
        default: "article"
        type: choice
        options:
          - genre
          - article
          - pinterest

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install anthropic

      - name: タスク種別を判定
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            # cronのスケジュール時刻からタスクを判定
            case "${{ github.event.schedule }}" in
              "0 0 1 * *") echo "name=genre" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * 1,4") echo "name=article" >> "$GITHUB_OUTPUT" ;;
              "30 0 * * 1,4") echo "name=pinterest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: タスクを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_task.py ${{ steps.task.outputs.name }}

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "kurashi-monosashi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add genres pinterest site
          git diff --cached --quiet || git commit -m "自動更新: ${{ steps.task.outputs.name }} タスク実行 ($(date +'%Y-%m-%d'))"
          git push
